version: source_v1
seed: 2026
lowercase: true
source_distribution: CHILDES-train2-MOT-FAT-full-spaCy

paths:
  raw_corpus: data/expanded_childes/pos/childes_train2_cds_full_spacy_pos.txt
  processed_dir: data/processed_expanded_full
  splits_dir: data/splits_expanded_full

split: {train: 0.8, dev: 0.1, test: 0.1}

special_tokens:
  pad: "[PAD]"
  unk: "[UNK]"
  bos: "[BOS]"
  eos: "[EOS]"
  mask: "[MASK]"
  mask_verb: "[MASK_VERB]"
  fw_mask: "<FW_MASK>"
  content_mask: "<CONTENT_MASK>"

comp_allowlist: [that, whether, if, because, when]
data: {min_utterance_tokens: 2, max_utterance_tokens: 80, vocab_min_freq: 1}

